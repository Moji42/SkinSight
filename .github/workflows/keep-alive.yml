# Pings the Render backend so the free instance doesn't spin down between visitors.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://skinsight-axsl.onrender.com/health
